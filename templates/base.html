<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mindflow{% endblock %}</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Пользовательские стили -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="theme-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('index') }}">Mindflow</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Главная</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('add') }}">Добавить</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('search') }}">Поиск</a></li>
        </ul>
        <!-- Кнопка для показа панели тем (иконка шестерёнки) -->
        <button id="theme-toggle" class="btn btn-sm btn-outline-light ms-3" title="Темы">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-gear-fill" viewBox="0 0 16 16">
            <path d="M9.405 1.05a.5.5 0 0 1 .49.598l-.342 1.87a5.522 5.522 0 0 1 .992.57l1.678-.84a.5.5 0 0 1 .667.219l1 1.732a.5.5 0 0 1-.218.667l-1.678.84c.04.323.07.65.07.984 0 .335-.03.662-.07.984l1.678.84a.5.5 0 0 1 .218.667l-1 1.732a.5.5 0 0 1-.667.219l-1.678-.84c-.304.248-.64.456-.992.57l.342 1.87a.5.5 0 0 1-.49.598h-2a.5.5 0 0 1-.49-.598l.342-1.87a5.522 5.522 0 0 1-.992-.57l-1.678.84a.5.5 0 0 1-.667-.219l-1-1.732a.5.5 0 0 1 .218-.667l1.678-.84A5.51 5.51 0 0 1 5.5 8c0-.335.03-.662.07-.984l-1.678-.84a.5.5 0 0 1-.218-.667l1-1.732a.5.5 0 0 1 .667-.219l1.678.84c.304-.248.64-.456.992-.57l-.342-1.87a.5.5 0 0 1 .49-.598h2zM8 10.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/>
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>

  <!-- Панель выбора тем (располагается в DOM перед скриптом) -->
  <div id="theme-picker-container">
    <div id="theme-picker">
      <div class="theme-swatch theme-light-btn" data-theme="light"></div>
      <div class="theme-swatch theme-dark-btn" data-theme="dark"></div>
      <div class="theme-swatch theme-blue-btn" data-theme="blue"></div>
      <div class="theme-swatch theme-green-btn" data-theme="green"></div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JS для переключения темы и управления панелью -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const body = document.body;
      const saved = localStorage.getItem("theme");
      if (saved) {
        body.classList.remove("theme-light", "theme-dark", "theme-blue", "theme-green");
        body.classList.add(`theme-${saved}`);
      }

      document.querySelectorAll(".theme-swatch").forEach(swatch => {
        swatch.addEventListener("click", () => {
          const selected = swatch.dataset.theme;
          body.classList.remove("theme-light", "theme-dark", "theme-blue", "theme-green");
          body.classList.add(`theme-${selected}`);
          localStorage.setItem("theme", selected);
          console.log("Тема изменена на:", selected);
        });
      });

      const themeToggleBtn = document.getElementById("theme-toggle");
      const themePickerContainer = document.getElementById("theme-picker-container");

      if (!themeToggleBtn || !themePickerContainer) {
        console.error("Элемент для переключения темы не найден");
        return;
      }

      // Обработчик для показа/скрытия панели по клику на иконку
      themeToggleBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        console.log("Кнопка 'Темы' нажата");
        themePickerContainer.classList.toggle("active");
      });

      // Клик вне панели — скрываем её
      document.addEventListener("click", (e) => {
        if (!themePickerContainer.contains(e.target) && e.target !== themeToggleBtn) {
          themePickerContainer.classList.remove("active");
        }
      });
    });
  </script>
</body>
</html>
