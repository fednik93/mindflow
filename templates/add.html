{% extends "base.html" %}
{% block title %}Добавить заметку{% endblock %}
{% block content %}
  <h1 class="mb-4 text-center">Добавить новую заметку</h1>
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <form method="post" class="p-4 shadow-sm rounded bg-white">
        <div class="mb-3">
          <label for="title" class="form-label">Заголовок</label>
          <input type="text" class="form-control" name="title" id="title" required>
        </div>

        <div class="mb-3">
          <label for="content" class="form-label">Содержимое</label>
          <textarea class="form-control" name="content" id="content" rows="5" required></textarea>
        </div>

        <div class="mb-3">
          <label for="date" class="form-label">Дата</label>
          <input type="date" class="form-control" name="date" id="date" value="{{ date_default }}" required>
        </div>

        <div class="mb-3">
          <label for="start_time" class="form-label">Время начала</label>
          <input type="time" class="form-control" name="start_time" id="start_time" value="{{ start_time_default }}">
        </div>

        <div class="mb-3">
          <label for="end_time" class="form-label">Время окончания</label>
          <input type="time" class="form-control" name="end_time" id="end_time" value="{{ end_time_default }}">
        </div>

        <div class="mb-3">
          <label for="category_id" class="form-label">Категория</label>
          <select name="category_id" id="category_id" class="form-select">
            <option value="">Без категории</option>
            {% for cat in categories %}
              <option value="{{ cat.id }}">{{ cat.name }}</option>
            {% endfor %}
          </select>
        </div>

        <button type="submit" class="btn btn-primary w-100">Добавить заметку</button>
      </form>
    </div>
  </div>
{% endblock %}
