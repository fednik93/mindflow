{% extends "base.html" %}
{% block title %}Календарь{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="fw-bold"><i class="bi bi-calendar-event-fill me-2"></i>Мой календарь</h2>
    <a href="{{ url_for('add') }}" class="btn btn-success">
      <i class="bi bi-plus-circle me-1"></i> Новое событие
    </a>
  </div>
  <div id="calendar"></div>
</div>

<!-- FullCalendar Modern CSS & JS -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js"></script>

<!-- Анимации и иконки -->
<link href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const calendarEl = document.getElementById('calendar');
    const calendar = new FullCalendar.Calendar(calendarEl, {
      locale: 'ru',
      firstDay: 1,
      selectable: true,
      selectMirror: true,
      nowIndicator: true,
      initialView: 'dayGridMonth',
      themeSystem: 'bootstrap5',
      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'dayGridMonth,timeGridWeek,listWeek'
      },
      events: {{ events|tojson|safe }},
      eventDisplay: 'block',
      eventColor: '#007bff',
      eventClick: function(info) {
        info.jsEvent.preventDefault();
        if (info.event.url) {
          window.location.href = info.event.url;
        }
      },
      select: function(info) {
        var start = info.startStr;
        var end = info.endStr;
        if (confirm(`Создать заметку с ${start} до ${end}?`)) {
          window.location.href = `/add?date=${start.substring(0, 10)}&start_time=${start.substring(11, 16)}&end_time=${end.substring(11, 16)}`;
        }
      },
      dayMaxEventRows: true,
      eventMouseEnter: function(info) {
        info.el.classList.add('animate__animated', 'animate__pulse');
      },
      eventMouseLeave: function(info) {
        info.el.classList.remove('animate__animated', 'animate__pulse');
      },
    });
    calendar.render();
  });
</script>
<style>
  #calendar {
    max-width: 900px;
    margin: 0 auto;
  }
</style>
{% endblock %}
